name: AgriGap Otomatik Tarama (ücretsiz)

# Yapay zekâ kullanmaz, ücretli hiçbir bileşen yoktur.
# Her gece 00:13 UTC'den itibaren saat başı denenir (ilk çalışan tarar), sabah site günceldir. Pazartesi, Çarşamba ve Cuma: haritada 10 ürünü yeniler ve
# kuyruktaki sıradaki 3 hedefi tarar. Diğer günler: yalnızca haritada hiç taranmamış ürünleri doldurur (en fazla 10),
# raporu discoveries/ altına yazar ve doğrudan main dalına yükler; site kendiliğinden güncellenir.
# Elle çalıştırmak için: Actions → AgriGap Otomatik Tarama → Run workflow.
# İsteğe bağlı: OPENALEX_API_KEY secret'ı (openalex.org'dan ücretsiz). Yoksa anahtarsız ücretsiz kota kullanılır.

on:
  schedule:
    # GitHub zamanlanmış işleri saatlerce geciktirebiliyor. Bu yüzden gece 00:13–06:13 UTC arası her saat
    # (Madrid 01:13–07:13 kış) ve gündüz iki yedek denemesi var. O gün ilk çalışan tarar; diğerleri ~10 sn'de atlar.
    - cron: '13 0-6,9,13 * * *'
  workflow_dispatch:
    inputs:
      target_id:
        description: 'Belirli bir hedef (ör. TRG-001). Boş bırakılırsa sıradaki 3 pending hedef.'
        required: false
        default: ''
      matrix_crops:
        description: 'Haritada bu çalışmada yenilenecek ürün sayısı (0 = harita atlanır)'
        required: false
        default: '10'
      reports:
        description: 'Ayrıntılı rapor sayısı (0 = atlanır)'
        required: false
        default: '3'
      cards:
        description: 'Yazılacak öneri kartı sayısı (0 = atlanır)'
        required: false
        default: '2'

permissions:
  contents: write
  pages: write

concurrency:
  group: agrigap-tarama
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bugün zaten çalıştı mı?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git fetch -q --depth=30 origin main
          TODAY=$(date -u +%Y-%m-%d)
          # Yalnızca bugünkü ZAMANLANMIŞ çalışmanın commit'i sayılır; elle başlatılan çalışmalar otomatik taramayı engellemez.
          # Yalnızca bugünkü ZAMANLANMIŞ çalışma sayılır (core/last_run.txt); elle başlatılan çalışmalar engellemez.
          LAST=$(git show origin/main:core/last_run.txt 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$EVENT" = "schedule" ] && [ "$LAST" = "$TODAY" ]; then
            echo "Bugün zaten çalıştı; yedek zamanlama atlandı."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Teknoloji Boşluk Haritası (OpenAlex)
        id: matrix
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROPS: ${{ inputs.matrix_crops || '10' }}
          EVENT: ${{ github.event_name }}
        run: |
          DOW=$(date -u +%u)
          if [ "$CROPS" = "0" ]; then exit 0; fi
          if [ "$EVENT" = "schedule" ] && [ "$DOW" != "1" ] && [ "$DOW" != "3" ] && [ "$DOW" != "5" ]; then
            python scripts/matrix_scan.py --crops "$CROPS" --only-missing
          else
            python scripts/matrix_scan.py --crops "$CROPS"
          fi

      - name: Yeni Öneriler — aday bulma (yapay zekâsız, API yok)
        id: ideas
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/ideas.py

      - name: Yeni Öneriler — öneri kartı (yapay zekâ katmanı 1, Gemini ücretsiz)
        id: cards
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          EVENT: ${{ github.event_name }}
          CARDS: ${{ inputs.cards || '2' }}
        run: |
          DOW=$(date -u +%u)
          if [ "$EVENT" = "schedule" ] && [ "$DOW" != "1" ] && [ "$DOW" != "3" ] && [ "$DOW" != "5" ]; then
            echo "Bugün kart günü değil (Pzt/Çar/Cum)."; exit 0
          fi
          if [ "$CARDS" != "0" ]; then python scripts/idea_cards.py --count "$CARDS"; fi

      - name: Kaynak tarama (OpenAlex)
        id: scan
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TARGET_ID: ${{ inputs.target_id }}
          EVENT: ${{ github.event_name }}
        run: |
          DOW=$(date -u +%u)
          if [ "$EVENT" = "schedule" ] && [ "$DOW" != "1" ] && [ "$DOW" != "3" ] && [ "$DOW" != "5" ]; then
            echo "Bugün rapor günü değil (Pzt/Çar/Cum)."; exit 0
          fi
          if [ -n "$TARGET_ID" ]; then
            python scripts/source_scan.py --id "$TARGET_ID"
          else
            N="${{ inputs.reports || '3' }}"
            if [ "$N" = "0" ]; then echo "Rapor atlandı."; exit 0; fi
            python scripts/source_scan.py --count "$N"
          fi

      - name: main dalına yükle
        if: steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || steps.scan.outputs.created == 'true' || steps.matrix.outputs.matrix_updated == 'true' || steps.cards.outputs.cards != '0' && steps.cards.outputs.cards != '')
        env:
          TID: ${{ steps.scan.outputs.target_id }}
          TITLE: ${{ steps.scan.outputs.title }}
          EVENT: ${{ github.event_name }}
        run: |
          TAG=""; [ "$EVENT" = "schedule" ] && TAG=" [zamanli]"
          git config user.name "agrigap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ "$EVENT" = "schedule" ] && date -u +%Y-%m-%d > core/last_run.txt
          git add discoveries core/targets.json matrix ideas
          [ -f core/last_run.txt ] && git add core/last_run.txt
          git diff --cached --quiet && { echo "Değişiklik yok."; exit 0; }
          git commit -m "tarama: ${TITLE:-harita/öneri güncellendi}${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Siteyi yenile (GitHub Pages)
        if: steps.scan.outputs.created == 'true' || steps.matrix.outputs.matrix_updated == 'true' || steps.cards.outputs.cards != '0' && steps.cards.outputs.cards != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages yenileme isteği atlandı (site birkaç dakika içinde kendiliğinden güncellenir)."
