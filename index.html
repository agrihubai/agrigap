<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriGap — Tarımdaki çözüm boşlukları</title>
<meta name="description" content="Türkiye ve Avrupa tarımındaki darboğazlar için önce dünyada yayımlanmış çözümleri haritalayan, düzenli aralıklarla kendiliğinden çalışan açık erişimli tarama merkezi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --film:#E9EEEA;      /* sera naylonu */
  --sheet:#F6F8F5;
  --loam:#2A231C;      /* toprak */
  --mute:#5E665F;
  --line:#C9D2CA;
  --leaf:#2F6B3A;
  --A:#4E7D8C; --B:#B8901F; --C:#9A3F55; --D:#3F3A8A;
  --ui:"Archivo",system-ui,sans-serif;
  --read:"Literata",Georgia,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--film);color:var(--loam)}
body{margin:0;font-family:var(--ui);font-size:16px;line-height:1.5;font-variation-settings:"wdth" 100}
a{color:var(--leaf)}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px;border-radius:2px}
#app:focus{outline:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* başlık */
header.top{padding:28px 0 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{text-decoration:none;color:var(--loam)}
.brand h1{margin:0;font-size:clamp(40px,7vw,76px);line-height:.9;font-weight:800;font-variation-settings:"wdth" 125;letter-spacing:-.02em}
.brand h1 span{color:var(--leaf)}
.lede{max-width:60ch;margin:14px 0 0;color:var(--mute);font-size:17px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0;margin-top:8px}
.lang button{all:unset;cursor:pointer;padding:6px 12px;font-size:14px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--loam);color:var(--film)}

/* boşluk ölçeği */
.scale{margin:36px 0 8px}
.scale-head{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px;font-variation-settings:"wdth" 85}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.band{all:unset;cursor:pointer;display:flex;flex-direction:column;min-height:168px;padding:14px 14px 12px;color:#fff;position:relative;transition:filter .15s}
.band:first-child{border-radius:14px 0 0 14px}.band:last-child{border-radius:0 14px 14px 0}
.band[data-d="A"]{background:var(--A)}.band[data-d="B"]{background:var(--B)}.band[data-d="C"]{background:var(--C)}.band[data-d="D"]{background:var(--D)}
.band .letter{font-size:56px;font-weight:800;line-height:1;font-variation-settings:"wdth" 125}
.band .name{font-weight:600;margin-top:6px;font-size:15px;line-height:1.25}
.band .count{margin-top:auto;font-size:14px;opacity:.9;font-variation-settings:"wdth" 85}
.band[aria-pressed="false"].dim{filter:saturate(.25) opacity(.55)}
.band:hover{filter:brightness(1.07)}
.band:focus-visible{outline:3px solid var(--loam);outline-offset:2px}

/* filtreler */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:28px 0 12px}
.filters label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
.filters select{font:inherit;font-size:15px;color:var(--loam);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:190px}
.reset{all:unset;cursor:pointer;font-size:14px;color:var(--leaf);padding:9px 2px;text-decoration:underline}

/* liste */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item a{display:grid;grid-template-columns:6px 110px 1fr;gap:18px;padding:20px 0;text-decoration:none;color:inherit;align-items:start}
.item a:hover .t{text-decoration:underline}
.bar{width:6px;align-self:stretch;border-radius:3px}
.when{font-size:14px;color:var(--mute);font-variation-settings:"wdth" 85;padding-top:3px}
.when b{display:block;color:var(--loam);font-size:15px}
.t{margin:0;font-size:21px;line-height:1.25;font-weight:700;font-variation-settings:"wdth" 92}
.f{margin:6px 0 0;font-family:var(--read);font-size:16px;color:#3d3832;max-width:70ch}
.lk{margin:10px 0 0;font-size:15px;line-height:1.45;max-width:70ch;display:flex;gap:10px}
.lk svg{flex-shrink:0;margin-top:2px}
.lk b{font-weight:700;margin-right:4px}
.linkbox{display:flex;gap:14px;background:var(--loam);color:var(--film);border-radius:12px;padding:16px 18px;margin:0 0 28px;font-family:var(--ui);font-size:17px;line-height:1.45}
.linkbox svg{flex-shrink:0;width:22px;height:22px;margin-top:2px}
.linkbox b{display:block;font-size:14px;font-weight:700;color:#B9D7BE;margin-bottom:2px}
.tax{margin-top:8px;font-size:13px;color:var(--mute)}
.kind{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:1px;font-variation-settings:"wdth" 90}
.kind.auto{background:#DCE6DE;color:var(--leaf)}.kind.deep{background:var(--loam);color:var(--film)}
.empty{padding:40px 0;color:var(--mute)}

/* kuyruk */
.queue{margin:48px 0 0}
.queue h2{font-size:22px;margin:0 0 4px;font-variation-settings:"wdth" 100}
.queue .qn{margin:0 0 14px;color:var(--mute);font-size:14px}
.qlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.qlist li{background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.4}
.qlist b{display:block;font-size:16px;margin-bottom:2px}
.qlist .src{display:block;margin-top:6px;color:var(--leaf);font-weight:600;font-size:13px}

/* rapor */
.report{display:grid;grid-template-columns:260px 1fr;gap:48px;padding:28px 0 64px}
.back{display:inline-block;margin:20px 0 0;font-size:15px}
.meta{position:sticky;top:20px;align-self:start;font-size:14px}
.meta .dec{display:flex;gap:12px;align-items:center;color:#fff;border-radius:12px;padding:12px 14px}
.meta .dec .letter{font-size:44px;font-weight:800;line-height:1;font-variation-settings:"wdth" 125}
.meta dl{margin:18px 0 0}
.meta dt{color:var(--mute);font-size:13px;margin-top:12px}
.meta dd{margin:2px 0 0;font-weight:600}
.meta .why{font-family:var(--read);font-weight:400;font-size:15px;margin-top:12px;line-height:1.5}
article{font-family:var(--read);font-size:18px;line-height:1.65;max-width:72ch;min-width:0}
article h1{font-family:var(--ui);font-size:clamp(30px,4.5vw,46px);line-height:1.08;margin:0 0 18px;font-variation-settings:"wdth" 100;letter-spacing:-.01em}
article .finding{font-size:21px;line-height:1.5;border-left:4px solid var(--leaf);padding:2px 0 2px 18px;margin:0 0 28px}
article h2{font-family:var(--ui);font-size:24px;line-height:1.25;margin:40px 0 10px;font-variation-settings:"wdth" 100}
article h3{font-family:var(--ui);font-size:18px}
article li{margin:6px 0}
article blockquote{margin:24px 0;padding:12px 16px;background:var(--sheet);border-radius:8px;font-size:15px;color:var(--mute)}
article code{font-family:var(--ui);font-size:.9em;background:var(--sheet);padding:1px 5px;border-radius:4px}
.tablewrap{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
article table{border-collapse:collapse;font-family:var(--ui);font-size:14px;line-height:1.4;min-width:760px}
article th,article td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
article th{font-weight:700;background:#E1E8E2}
article tr:last-child td{border-bottom:0}
.note{font-size:14px;color:var(--mute);margin:0 0 18px}

footer{border-top:1px solid var(--line);margin-top:56px;padding:28px 0 48px;font-size:14px;color:var(--mute);display:grid;grid-template-columns:2fr 1fr;gap:24px}
footer p{margin:0 0 8px;max-width:62ch}


/* sekmeler */
.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--line)}
.tabs a{white-space:nowrap;padding:10px 14px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--loam);border-bottom-color:var(--leaf)}

/* teknoloji boşluk haritası */
.mx-intro{max-width:72ch;color:var(--mute);margin:20px 0 6px}
.mx-status{font-size:14px;color:var(--mute);margin:0 0 16px}
.mx-ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:0 0 14px}
.mx-ctl label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
.mx-ctl select{font:inherit;font-size:15px;color:var(--loam);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:8px 14px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--loam);color:var(--film)}
.mx-wrap{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;font-variation-settings:"wdth" 85}
table.mx th,table.mx td{border-right:1px solid var(--film);border-bottom:1px solid var(--film)}
table.mx thead th{position:sticky;top:0;background:#E1E8E2;z-index:2;font-weight:700;padding:6px 4px;vertical-align:bottom}
table.mx thead tr:nth-child(2) th{top:28px;height:190px;width:46px;min-width:46px}
table.mx thead tr:nth-child(2) th span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto;font-weight:600;max-height:184px;overflow:hidden;text-overflow:ellipsis}
table.mx .rh{position:sticky;left:0;background:var(--sheet);z-index:1;text-align:left;padding:4px 10px;white-space:nowrap;font-size:13px;font-weight:600;min-width:150px}
table.mx thead .rh{z-index:3;background:#E1E8E2}
table.mx tr.grp th{position:sticky;left:0;text-align:left;background:var(--film);padding:8px 10px;font-size:13px;color:var(--leaf)}
table.mx td{text-align:center;height:30px;min-width:46px;padding:0}
table.mx td button{all:unset;cursor:pointer;display:block;width:100%;height:30px;line-height:30px;font-weight:600}
table.mx td button:focus-visible{outline:3px solid var(--loam);outline-offset:-3px}
table.mx td.na button{color:#9aa39b;background:repeating-linear-gradient(45deg,transparent 0 4px,#e3e8e3 4px 8px)}
table.mx td.sel button{outline:3px solid var(--loam);outline-offset:-3px}
.gap-w{background:var(--D)!important;color:#fff!important}
.gap-r{background:var(--B)!important;color:#fff!important}
.dimcell{color:#9aa39b!important;background:transparent!important}
.mx-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);margin:10px 0 0}
.mx-legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.mx-detail{margin:18px 0 0;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:760px}
.mx-detail h3{margin:0 0 8px;font-size:18px}
.mx-detail table{border-collapse:collapse;font-size:14px;margin:8px 0}
.mx-detail th,.mx-detail td{padding:6px 12px 6px 0;text-align:left;border-bottom:1px solid var(--line)}
.mx-detail p{margin:8px 0 0;font-size:14px;color:var(--mute)}


/* mevzuat */
.tabs .regbtn{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin-bottom:6px;align-self:center;color:var(--loam);font-size:14px}
.tabs .regbtn[aria-current="page"]{background:var(--loam);color:var(--film);border-color:var(--loam)}
.reg-intro{max-width:72ch;color:var(--mute);margin:20px 0 14px}
.reg-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.reg{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.reg h3{margin:0 0 2px;font-size:18px}
.reg .ref{font-size:13px;color:var(--mute);margin:0 0 8px}
.reg .badges{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.reg .b{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E1E8E2}
.reg .b.EU{background:#DDE4F2}.reg .b.TR{background:#F4DEDE}
.reg .b.proposal{background:var(--B);color:#fff}.reg .b.upcoming{background:var(--A);color:#fff}.reg .b.in_force{background:var(--leaf);color:#fff}
.reg ol{list-style:none;margin:0 0 10px;padding:0;border-left:3px solid var(--line)}
.reg ol li{padding:2px 0 6px 12px;font-size:14px}
.reg ol b{display:inline-block;min-width:92px;font-variation-settings:"wdth" 85}
.reg p.s{font-family:var(--read);margin:0 0 8px}
.reg .src{font-size:13px;margin:0}
.reg .src a{margin-right:10px}


/* yeni öneriler */
.id-intro{max-width:72ch;color:var(--mute);margin:20px 0 10px}
.id-stage{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:14px;max-width:760px}
.id-sec{margin:22px 0 0}
.id-sec h2{font-size:19px;margin:0 0 2px}
.id-sec .why{margin:0 0 10px;color:var(--mute);font-size:14px;max-width:72ch}
.id-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.id-card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45}
.id-card b.h{display:block;font-size:15px;margin-bottom:4px}
.id-card .lay{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:#E1E8E2;margin-bottom:6px}
.id-card .lnk{margin-top:8px;font-size:13px;display:flex;gap:12px;flex-wrap:wrap}


/* öneri kartları */
.cards{display:grid;gap:14px;margin:6px 0 10px}
.icard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-family:var(--ui);font-size:15px;line-height:1.5;max-width:none}
.icard .tw{overflow-x:auto}
.icard h3{margin:0 0 6px;font-size:20px;line-height:1.25}
.icard .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.icard .chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E1E8E2}
.icard .chip.warn{background:var(--B);color:#fff}.icard .chip.ai{background:var(--loam);color:var(--film)}.icard .chip.off{background:#eee;color:var(--mute)}
.icard .fd{font-family:var(--read);font-size:17px;border-left:4px solid var(--leaf);padding-left:12px;margin:8px 0 10px}
.icard details{border-top:1px solid var(--line);padding:8px 0}
.icard summary{cursor:pointer;font-weight:700}
.icard .prop{background:var(--sheet);border-radius:10px;padding:10px 12px;margin:8px 0}
.icard .prop b.t{display:block;font-size:16px;margin:4px 0}
.icard dl{margin:6px 0 0;display:grid;grid-template-columns:180px 1fr;gap:4px 12px;font-size:14px}
.icard dt{color:var(--mute)}.icard dd{margin:0}
.icard table{border-collapse:collapse;font-size:13px;margin-top:8px}
.icard td,.icard th{border:1px solid var(--line);padding:3px 8px;text-align:left}
.g-strong{color:var(--leaf);font-weight:700}.g-medium{color:var(--B);font-weight:700}.g-weak{color:var(--C);font-weight:700}
.icard ol.src{font-size:13px;padding-left:20px}
@media (max-width:820px){.icard dl{grid-template-columns:1fr}}

/* çözüm olgunluğu */
.mat{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:1px;background:#EEE9DC;color:var(--loam);font-variation-settings:"wdth" 90}
.mat.no_known,.mat.insufficient_evidence{background:#E4E2F2;color:var(--D)}
.mat.no_validated,.mat.no_field_proven,.mat.no_scalable{background:#F4E9CF;color:#7A5E10}
.mat.field_reported{background:#DCE6DE;color:var(--leaf)}
.mat.not_assessed{background:#ECEFEC;color:var(--mute)}
.dempty{background:var(--sheet);border:1px solid var(--line);border-left:6px solid var(--D);border-radius:12px;padding:16px 18px;margin:8px 0 0;max-width:820px;font-size:15px}
.dempty h3{margin:0 0 6px;font-size:18px}
.dempty p{margin:6px 0}
.dempty ul{margin:6px 0 0;padding-left:20px}
.matkey{margin:6px 0 0;font-size:14px;color:var(--mute);max-width:820px}
.matkey summary{cursor:pointer;color:var(--leaf);font-weight:600}
.matkey table{border-collapse:collapse;margin:8px 0;font-size:13px}
.matkey td{padding:4px 10px 4px 0;vertical-align:top;border-bottom:1px solid var(--line)}

/* etki ve değer atlası */
.at-intro{max-width:72ch;color:var(--mute);margin:20px 0 4px}
.at-sub{margin:0 0 14px;font-weight:700;color:var(--leaf);font-size:15px}
.at-panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.at-panel fieldset{border:0;margin:0;padding:0;min-width:0}
.at-panel legend{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px;padding:0}
.at-panel legend small{font-weight:400}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;user-select:none}
.chipset input{accent-color:var(--leaf);margin:0}
.chipset label:has(input:checked){background:var(--loam);color:var(--film);border-color:var(--loam)}
.chipset label:has(input:focus-visible){outline:3px solid var(--leaf);outline-offset:2px}
.at-more summary{cursor:pointer;font-size:13px;color:var(--leaf);font-weight:600;margin:6px 0}
.at-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;font-weight:700;font-size:15px;border:1px solid var(--loam)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--loam);outline-offset:2px}
.at-hint{font-size:13px;color:var(--mute)}
.at-stale{display:flex;gap:10px;align-items:flex-start;background:#F4E9CF;border:1px solid #E2CF9A;border-radius:10px;padding:10px 14px;margin:14px 0 0;font-size:14px}
.at-crit{font-size:13px;color:var(--mute);margin:16px 0 8px}
.at-crit b{color:var(--loam)}
.at-res.stale .at-tw{opacity:.45}
.at-tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
table.at{border-collapse:collapse;font-size:13px;line-height:1.4;min-width:820px;width:100%}
table.at th,table.at td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
table.at thead th{background:#E1E8E2;position:sticky;top:0;font-weight:700}
table.at th.rk{min-width:210px;background:var(--sheet);position:sticky;left:0;z-index:1}
table.at thead th.rk{background:#E1E8E2;z-index:2}
table.at tr.ind th{background:var(--film);color:var(--leaf);font-size:13px;position:static}
.at-v{display:block;margin:0 0 6px}
.at-v b{font-size:15px}
.at-v .u{color:var(--mute);font-size:12px;margin-left:3px}
.at-e{color:var(--mute);font-style:italic}
.q{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;margin:2px 4px 0 0;background:#E1E8E2;font-style:normal}
.q.official,.q.official_derived{background:#DDE4F2}.q.peer_reviewed{background:#DCE6DE;color:var(--leaf)}.q.modelled{background:#F4E9CF}.q.na,.q.insufficient{background:#ECEFEC;color:var(--mute)}
.bd{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#fff;border:1px solid var(--line);margin:2px 4px 0 0}
.srcbtn{all:unset;cursor:pointer;color:var(--leaf);font-size:12px;text-decoration:underline;margin-left:2px}
.srcbtn:focus-visible{outline:2px solid var(--leaf)}
.warn{display:block;font-size:12px;color:#7A5E10;margin-top:4px}
tr.det td{background:#fff;font-size:13px}
tr.det dl{display:grid;grid-template-columns:200px 1fr;gap:3px 12px;margin:0}
tr.det dt{color:var(--mute)}tr.det dd{margin:0;word-break:break-word}
.gaps{margin:26px 0 0}
.gaps h2{font-size:20px;margin:0 0 4px}
.gaps h3{font-size:16px;margin:16px 0 6px}
.gaps .why{color:var(--mute);font-size:14px;max-width:76ch;margin:0 0 10px}
.gap-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gap-list li{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45}
.gap-list li b.h{display:block;font-size:15px}
.gap-list li.v{border-left:5px solid var(--D)}.gap-list li.m{border-left:5px solid var(--B)}
.gap-list dl{margin:6px 0 0;display:grid;grid-template-columns:130px 1fr;gap:2px 10px;font-size:13px}
.gap-list dt{color:var(--mute)}.gap-list dd{margin:0}
.incomp{font-size:14px;color:var(--mute)}
.incomp summary{cursor:pointer;color:var(--leaf);font-weight:600}
.opp{border-left:5px solid var(--leaf)}
.opp .lv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:6px 0 0;font-size:13px}
.opp .lv dt{font-weight:700}
.opp .lv dt.ev{color:var(--leaf)}.opp .lv dt.in{color:var(--A)}.opp .lv dt.hy{color:#7A5E10}.opp .lv dt.sp{color:var(--C)}
@media (max-width:820px){tr.det dl,.gap-list dl,.opp .lv{grid-template-columns:1fr}table.at th.rk{min-width:150px}}

@media (max-width:820px){
  .tabs{flex-wrap:wrap}
  .tabs a{padding:10px 8px}
  .tabs .regbtn{margin:4px 0 8px;order:5}
  .bands{grid-template-columns:repeat(2,1fr)}
  .band{min-height:120px}
  .band:nth-child(1){border-radius:14px 0 0 0}.band:nth-child(2){border-radius:0 14px 0 0}
  .band:nth-child(3){border-radius:0 0 0 14px}.band:nth-child(4){border-radius:0 0 14px 0}
  .item a{grid-template-columns:6px 1fr;gap:6px 14px}
  .item .bar{grid-row:1 / span 2}
  .item .when,.item .body{grid-column:2}
  .item .when b{display:inline;margin-right:8px}
  .filters select{min-width:0;width:100%}
  .filters label{flex:1 1 100%}
  .report{grid-template-columns:1fr;gap:24px}
  .meta{position:static;order:2;border-top:1px solid var(--line);padding-top:20px}
  footer{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const mx = {data:null, layer:"mech", view:"w", sel:null};
function mxVal(v,view){ if(!v) return null; return view.startsWith("g")? v.w : v[view]; }
function mxClass(v,view){
  if(!v) return "";
  if(!view.startsWith("g")) return "";
  const r = view==="gTR"? v.tr : v.es;
  if(v.w<5) return "gap-w";
  if(v.w>=30 && r<=1) return "gap-r";
  return "dimcell";
}
function mxBg(val,max){
  if(val==null) return "";
  const k = Math.log10(val+1)/Math.log10(max+1);
  const a = (0.08+0.82*k).toFixed(2);
  return `background:rgba(47,107,58,${a});color:${k>0.55?"#fff":"var(--loam)"}`;
}
function mxQueue(ck,ok,lk){
  const key = `${ck}|${ok}|${lk}`;
  return state.targets.find(x=>x.matrix_cell===key);
}
function mapPage(){
  const m = mx.data;
  if(!m){ app.innerHTML = `<p class="empty">${t("mxNone")}</p>`; return; }
  const view = mx.view, layer = mx.layer;
  const vk0 = {w:"w",vTR:"tr",vES:"es",vEU:"eu",gTR:"gTR",gES:"gES"}[view]||"w";
  const vals = Object.values(m.cells).map(c=>c[layer]).filter(Boolean).map(v=>mxVal(v,vk0)).filter(x=>x!=null);
  const max = Math.max(1,...vals);
  const scanned = Object.keys(m.crop_updated||{}).length;
  const last = Object.values(m.crop_updated||{}).sort().pop()||"—";
  const phases = [...new Set(m.ops.map(o=>o.phase))];
  const groups = [...new Set(m.crops.map(c=>c.group))];
  const vkey = {w:"w",vTR:"tr",vES:"es",vEU:"eu",gTR:"gTR",gES:"gES"};
  const vk = vkey[view]||"w";
  const oN = o => lang==="en" ? (o.en||o.tr) : o.tr, cN = c => lang==="en" ? (c.label_en||c.tr) : c.tr;
  let head1 = `<tr><th class="rh" rowspan="2"></th>${phases.map(p=>`<th colspan="${m.ops.filter(o=>o.phase===p).length}">${esc(tx(p))}</th>`).join("")}</tr>`;
  let head2 = `<tr>${m.ops.map(o=>`<th title="${esc(oN(o))}"><span>${esc(oN(o))}</span></th>`).join("")}</tr>`;
  let body = groups.map(g=>`<tr class="grp"><th colspan="${m.ops.length+1}">${esc(tx(g))}</th></tr>`+
    m.crops.filter(c=>c.group===g).map(c=>`<tr><th class="rh" scope="row">${esc(cN(c))}</th>${m.ops.map(o=>{
      const cell = m.cells[`${c.key}|${o.key}`]; const v = cell && cell[layer];
      const isSel = mx.sel && mx.sel[0]===c.key && mx.sel[1]===o.key;
      if(!v) return `<td class="na${isSel?" sel":""}"><button type="button" data-c="${c.key}" data-o="${o.key}" aria-label="${esc(cN(c))} · ${esc(oN(o))}">·</button></td>`;
      const val = mxVal(v, vk);
      const cls = mxClass(v, vk);
      return `<td class="${isSel?"sel":""}"><button type="button" class="${cls}" style="${cls?"":mxBg(val,max)}" data-c="${c.key}" data-o="${o.key}" aria-label="${esc(cN(c))} · ${esc(oN(o))}: ${val}">${val}</button></td>`;
    }).join("")}</tr>`).join("")).join("");
  app.innerHTML = `
    <p class="mx-intro">${t("mxIntro")}</p>
    <p class="mx-status">${t("mxStatus")(scanned, m.crops.length, last)}</p>
    <div class="mx-ctl">
      <label>${t("mxLayer")}<span class="seg" role="group">${m.layers.map(l=>`<button type="button" data-l="${l.key}" aria-pressed="${l.key===layer}">${esc(lang==="en"?l.en:l.tr)}</button>`).join("")}</span></label>
      <label>${t("mxView")}<select id="mxv">${["w","vTR","vES","vEU","gTR","gES"].map(k=>`<option value="${k}" ${k===view?"selected":""}>${t(k==="w"?"vW":k)}</option>`).join("")}</select></label>
    </div>
    <div class="mx-wrap"><table class="mx"><thead>${head1}${head2}</thead><tbody>${body}</tbody></table></div>
    <div class="mx-legend">
      ${vk.startsWith("g")?`<span><i style="background:var(--D)"></i>${t("lgW")}</span><span><i style="background:var(--B)"></i>${t("lgR")}</span>`:`<span><i style="background:rgba(47,107,58,.85)"></i>${t("lgS")}</span>`}
      <span><i style="background:repeating-linear-gradient(45deg,#fff 0 3px,#d5dcd6 3px 6px)"></i>${t("lgNA")}</span>
    </div>
    <div class="mx-detail" id="mxd">${mxDetail()}</div>`;
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{mx.layer=b.dataset.l;mapPage();});
  app.querySelector("#mxv").onchange=e=>{mx.view=e.target.value;mapPage();};
  app.querySelectorAll("table.mx td button").forEach(b=>b.onclick=()=>{mx.sel=[b.dataset.c,b.dataset.o];
    app.querySelectorAll("table.mx td.sel").forEach(x=>x.classList.remove("sel"));
    b.parentElement.classList.add("sel"); document.getElementById("mxd").innerHTML=mxDetail();});
}
function mxDetail(){
  const m = mx.data; if(!mx.sel) return `<p>${t("mxPick")}</p>`;
  const c = m.crops.find(x=>x.key===mx.sel[0]), o = m.ops.find(x=>x.key===mx.sel[1]);
  const cell = m.cells[`${c.key}|${o.key}`];
  const head = `${esc(lang==="en"?(c.label_en||c.tr):c.tr)} · ${esc(lang==="en"?(o.en||o.tr):o.tr)}`;
  if(!cell) return `<h3>${head}</h3><p>${t("mxNone")}</p>`;
  const trl = m.layers.map(l=>(cell[l.key]||{}).trl||0).reduce((a,b)=>a+b,0);
  const rows = m.layers.map(l=>{const v=cell[l.key]||{};return `<tr><th>${esc(lang==="en"?l.en:l.tr)}</th><td>${v.w??"—"}</td><td>${v.tr??"—"}</td><td>${v.es??"—"}</td><td>${v.eu??"—"}</td></tr>`;}).join("");
  const notes = m.layers.map(l=>{const q=mxQueue(c.key,o.key,l.key); if(!q) return "";
    const r = state.reports.find(x=>x.id===q.id);
    return `<p>${esc(lang==="en"?l.en:l.tr)}: ${r?`<a href="#/r/${encodeURIComponent(q.id)}">${t("mxReport")(q.id)}</a>`:t("mxQueued")(q.id)}</p>`;}).join("");
  return `<h3>${head}</h3>
    <table><thead><tr><th></th><th>${t("vW")}</th><th>${t("vTR")}</th><th>${t("vES")}</th><th>${t("vEU")}</th></tr></thead><tbody>${rows}</tbody></table>
    ${notes}<p>${t("mxEU")}</p>${trl?`<p>${t("mxTRL")(trl)}</p>`:""}`;
}

        ${it.tags.map(k=>`<span class="b">${esc(tagName(k))}</span>`).join("")}</div>

      <p class="s">${esc(lang==="en"?it.summary_en:it.summary_tr)}</p>

const idv = {data:null, type:""};
function ideasPage(){
  const d = idv.data, m = mx.data;
  const C = k => { const c=(m&&m.crops||[]).find(x=>x.key===k); return c ? (lang==="en"?(c.label_en||c.tr):c.tr) : k; };
  const O = k => { const o=(m&&m.ops||[]).find(x=>x.key===k); return o ? (lang==="en"?(o.en||o.tr):o.tr) : k; };
  const L = k => { const l=(m&&m.layers||[]).find(x=>x.key===k); return l ? (lang==="en"?l.en:l.tr) : k; };
  const types = ["transfer","neighbor","layer","gap"];
  const card = (k,x) => {
    const s = k==="neighbor" ? t("idS_neighbor")(x, C(x.neighbor)) : k==="layer" ? t("idS_layer")(x, L(x.other_layer)) : t("idS_"+k)(x);
    const q = x.target && state.reports.find(r=>r.id===x.target);
    return `<li class="id-card"><b class="h">${esc(C(x.crop))} · ${esc(O(x.op))}</b><span class="lay">${esc(L(x.layer))}</span><div>${esc(s)}</div>
      <div class="lnk"><a href="#/harita/${x.crop}/${x.op}/${x.layer}">${t("idMap")}</a>
      ${x.regulations.length?`<a href="#/mevzuat">${t("idRegs")(x.regulations.length)}</a>`:""}
      ${x.target?(q?`<a href="#/r/${encodeURIComponent(x.target)}">${t("idQueued")(x.target)}</a>`:`<span>${t("idQueued")(x.target)}</span>`):""}</div></li>`;
  };
  const secs = d ? types.filter(k=>!idv.type||k===idv.type).map(k=>{
    const v = d.candidates[k]||[];
    return `<section class="id-sec"><h2>${t("idT_"+k)} (${v.length})</h2><p class="why">${t("idW_"+k)}</p>
      ${v.length?`<ul class="id-list">${v.map(x=>card(k,x)).join("")}</ul>`:`<p class="why">${t("idNone")}</p>`}</section>`;
  }).join("") : `<p class="empty">${t("idNone")}</p>`;
  const pub = ic.index ? ic.index.cards.filter(x=>x.published && ic.cards[x.id]).map(x=>ic.cards[x.id]) : [];

    ${pub.length?`<div class="cards">${pub.map(c=>cardHtml(c,C,O,L)).join("")}</div>`:`<p class="why">${t("idCardsNone")}</p>`}</section>`;
  app.innerHTML = `<p class="id-intro">${t("idIntro")}</p>
    ${cardsSec}
    ${oppsHtml()}

    <div class="mx-ctl"><label>${t("idType")}<select id="idt"><option value="">${t("idAllTypes")}</option>${types.map(k=>`<option value="${k}" ${k===idv.type?"selected":""}>${t("idT_"+k)}</option>`).join("")}</select></label></div>

/* ---------- Etki ve Değer Atlası ---------- */
const atl = {loaded:false, err:false, promise:null, cfg:null, src:{}, obs:[], checks:[], techs:{}, products:[],
  sel:{p:[], r:[], s:[], c:[], i:[]}, sub:null, res:null, open:new Set()};
const OFFICIAL_INDS = ["production_volume","production_value","value_per_kg","value_per_ha","export_value"];
const SOLUTION_INDS = ["solution_cf","cf_reduction","effectiveness","trl"];
function loadAtlas(){
  if(atl.promise) return atl.promise;
  const j = f => fetch("atlas/"+f,{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error(f); return r.json(); });
  atl.promise = Promise.all([j("config.json"), j("sources.json"), j("observations.json"), j("official.json").catch(()=>({observations:[],checks:[]}))])
    .then(([cfg,src,cur,off])=>{
      atl.cfg = cfg;
      src.sources.forEach(s=>atl.src[s.id]=s);
      (cur.technologies||[]).forEach(x=>atl.techs[x.id]=x);
      atl.obs = [...(cur.observations||[]), ...(off.observations||[])];
      atl.checks = off.checks||[];
      atl.generated = off.generated||"";
      const have = new Set(cfg.products.map(p=>p.id));
      const extra = ((mx.data&&mx.data.crops)||[]).filter(c=>!have.has(c.key))
        .map(c=>({id:c.key, tr:c.tr, en:c.label_en||c.tr, group:c.group, extra:true}));
      atl.products = [...cfg.products, ...extra];
      atl.loaded = true;
    }).catch(e=>{ atl.err = true; atl.promise = null; throw e; });
  return atl.promise;
}
const L2 = o => o ? (lang==="en" ? (o.en||o.tr) : (o.tr||o.en)) : "";
const biL = s => { if(!s) return ""; const p = String(s).split(" · "); return p.length===2 ? (lang==="en"?p[1]:p[0]) : s; };
const aP = id => L2(atl.products.find(x=>x.id===id)) || id;
const aR = id => L2(atl.cfg.regions.find(x=>x.id===id)) || id;
const aS = id => L2(atl.cfg.systems.find(x=>x.id===id)) || id;
const aC = id => L2(atl.cfg.solution_categories.find(x=>x.id===id)) || id;
const aI = id => id==="reliability" ? t("relRow") : (L2(atl.cfg.indicators.find(x=>x.id===id)) || id);
const aQ = id => L2(atl.cfg.quality.find(x=>x.id===id)) || id;
const aB = id => L2(atl.cfg.boundaries.find(x=>x.id===id)) || id;
const aT = id => L2(atl.techs[id]) || id || "—";
const aSrc = id => (atl.src[id]||{}).title || id;
const nf = v => typeof v==="number" ? new Intl.NumberFormat(lang==="en"?"en-GB":"tr-TR",{maximumFractionDigits:3}).format(v) : esc(v);
const unitL = u => lang==="en" ? String(u||"").replace("milyon €","million €").replace("sıra","rank") : (u||"");

function atlasHashSel(){
  const m = location.hash.match(/^#\/atlas\/(.+)$/); if(!m) return false;
  const sel = {p:[], r:[], s:[], c:[], i:[]};
  decodeURIComponent(m[1]).split(";").forEach(kv=>{ const [k,v]=kv.split("="); if(sel[k]&&v) sel[k]=v.split(",").filter(Boolean); });
  if(!sel.p.length||!sel.r.length) return false;
  atl.sel = sel; atl.sub = atlasOrder(JSON.parse(JSON.stringify(sel))); atl.res = atlasBuild(atl.sub); atl.open.clear();
  try{ history.replaceState(null, "", "#/atlas"); }catch(e){}  // bağlantıdaki seçim bir kez uygulanır; dil değişince sıfırlanmaz
  return true;
}
function atlasOrder(sub){  // sütun ve satır sırası tıklama sırasına değil, ayar dosyasındaki sıraya göre
  const ord = (list, ids) => ids.slice().sort((a,b)=>list.findIndex(x=>x.id===a)-list.findIndex(x=>x.id===b));
  sub.p = ord(atl.products, sub.p); sub.r = ord(atl.cfg.regions, sub.r);
  return sub;
}
const selKey = s => JSON.stringify(["p","r","s","c","i"].map(k=>[...(s[k]||[])].sort()));
const defaultInds = () => atl.cfg.indicators.filter(x=>x.default).map(x=>x.id);

function chipset(name, items, cur){

}

  app.innerHTML = `

        ${extra.length?`<details class="at-more" ${S.p.some(id=>extra.find(x=>x.id===id))?"open":""}><summary>${t("atMore")(extra.length)}</summary>${chipset("p", extra.map(p=>({id:p.id,label:L2(p)})), S.p)}</details>`:""}
      </fieldset>
      <fieldset><legend>${t("atRegions")} <small>${t("atMulti")}</small></legend>${chipset("r", c.regions.map(x=>({id:x.id,label:L2(x)})), S.r)}</fieldset>
      <fieldset><legend>${t("atSystems")} <small>${t("atOpt")}</small></legend>${chipset("s", c.systems.map(x=>({id:x.id,label:L2(x)})), S.s)}</fieldset>
      <fieldset><legend>${t("atCats")} <small>${t("atOpt")}</small></legend>${chipset("c", c.solution_categories.map(x=>({id:x.id,label:L2(x)})), S.c)}</fieldset>
      <fieldset><legend>${t("atInds")} <small>${t("atOpt")}</small></legend>${chipset("i", inds, S.i)}</fieldset>
      <div class="at-actions">
        <button type="button" class="btn primary" id="atgo">${t("atShow")}</button>
        <button type="button" class="btn" id="atreset">${t("atReset")}</button>
        <button type="button" class="btn" id="atcsv" ${atl.res&&atl.res.rows.length?"":"hidden"}>${t("atCsv")}</button>
        <span class="at-hint" id="athint" aria-live="polite"></span>
      </div>
    </form>
    <div id="atres" class="at-res">${atl.res?atlasResultHtml():""}</div>`;
  app.querySelectorAll("#atf input[type=checkbox]").forEach(cb=>cb.onchange=()=>{
    const g = cb.dataset.g, set = new Set(atl.sel[g]); cb.checked ? set.add(cb.value) : set.delete(cb.value);
    atl.sel[g] = [...set];
    app.querySelectorAll(`#atf input[data-g="${g}"][value="${cb.value}"]`).forEach(x=>x.checked=cb.checked); // aynı ürün iki listede olabilir

    if(!atl.sel.p.length||!atl.sel.r.length) return;

    const box = app.querySelector("#atres"); box.innerHTML = `<p class="at-hint" role="status">${t("atLoading")}</p>`;
    setTimeout(()=>{ atl.res = atlasBuild(atl.sub); atlasPage(); const r=document.getElementById("atres"); if(r) r.scrollIntoView({block:"start",behavior:"smooth"}); }, 0);

  app.querySelector("#atreset").onclick=()=>{ atl.sel={p:[],r:[],s:[],c:[],i:[]}; atl.sub=null; atl.res=null; atl.open.clear(); atlasPage(); };
  app.querySelector("#atcsv").onclick=atlasCsv;

function atlasUpdate(){
  const ok = atl.sel.p.length && atl.sel.r.length;
  const go = app.querySelector("#atgo"); if(!go) return;
  go.disabled = !ok; go.setAttribute("aria-disabled", String(!ok));
  app.querySelector("#athint").textContent = ok ? "" : t("atNeed");
  const stale = atl.sub && selKey(atl.sel)!==selKey(atl.sub);
  const res = app.querySelector("#atres"); if(!res) return;
  res.classList.toggle("stale", !!stale);
  const b = res.querySelector(".at-stale"); if(b) b.hidden = !stale;
}
function atlasBind(){
  app.querySelectorAll(".srcbtn").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; atl.open.has(k)?atl.open.delete(k):atl.open.add(k);
    const box = app.querySelector("#atres"); box.innerHTML = atlasResultHtml(); atlasBind(); atlasUpdate(); });
}

/* satır üretimi: tüm değerler yalnızca kaynak kayıtlarından gelir */
function atEmpty(p, ind, sys, rid){
  const prod = atl.products.find(x=>x.id===p) || {};
  if(sys && sys!=="all" && prod.systems && !prod.systems.includes(sys)) return {label:"e_not_applicable", why:t("ew_sys")};
  const ck = atl.checks.find(x=>x.product_id===p && x.region_id===rid && x.indicator_id===ind && (x.production_system_id===sys || (!sys||sys==="all")));
  if(ck){ const w = ck.why==="not_in_nomenclature"?t("ew_nom"):ck.why==="no_item_for_product"?t("ew_noitem"):ck.why==="no_area_same_year"?t("ew_area"):t("ew_gap")(aSrc(ck.source_id));
    return {label:"e_na", why:w, check:ck}; }
  if(rid==="world" && OFFICIAL_INDS.includes(ind)) return {label:"e_not_assessed", why:t("ew_world")};
  return {label:"e_not_assessed", why:""};
}
function atlasBuild(sub){
  const inds = sub.i.length ? sub.i : defaultInds();
  const R = sub.r, rows = [];
  const sysF = sub.s.filter(x=>x!=="all");  // "Tüm sistemler" seçimi filtre değildir: her sistemi gösterir
  const sysOk = o => !sysF.length || sysF.includes(o.production_system_id);
  const catOk = o => !sub.c.length || sub.c.includes((atl.techs[o.technology_id]||{}).category);
  const inR = o => R.includes(o.region_id);
  const cellsFor = (list, emptyFn) => Object.fromEntries(R.map(rid=>{ const os=list.filter(o=>o.region_id===rid); return [rid, os.length?{obs:os}:{empty:emptyFn(rid)}]; }));
  inds.filter(i=>i!=="reliability").forEach(ind=>{
    sub.p.forEach(p=>{
      if(ind==="econ_rank"){
        const cells = {};
        R.forEach(rid=>{
          const vals = atl.obs.filter(o=>o.indicator_id==="production_value" && o.region_id===rid && o.production_system_id==="all" && sub.p.includes(o.product_id));
          const yr = vals.map(o=>o.data_year).sort().pop();
          const same = vals.filter(o=>o.data_year===yr && o.source_id==="eurostat-aact_eaa01").sort((a,b)=>b.value-a.value);
          const i = same.findIndex(o=>o.product_id===p);
          cells[rid] = same.length>=2 && i>=0 ? {obs:[{...same[i], id:"rank:"+same[i].id, indicator_id:"econ_rank", rank:i+1, of:same.length, data_quality:"official_derived"}]}
            : {empty:{label:"e_insufficient", why:t("ew_rank")}};
        });
        rows.push({p, ind, sys:"all", cells}); return;
      }
      if(ind==="trl"){
        const techs = Object.values(atl.techs).filter(x=>x.trl!=null && catOk({technology_id:x.id}));
        // Kanıta dayalı TRL kaydı yoksa değer atanmaz
        const tl = techs.filter(x=>atl.obs.some(o=>o.product_id===p && o.technology_id===x.id));
        rows.push({p, ind, sys:"all", cells:cellsFor(tl.length?[]:[], ()=>({label:"e_not_assessed", why:""}))}); return;
      }
      if(SOLUTION_INDS.includes(ind)){
        const src = ind==="solution_cf" ? ["product_cf","cf_reduction"] : [ind];
        const os = atl.obs.filter(o=>o.product_id===p && src.includes(o.indicator_id) && o.technology_id && inR(o) && sysOk(o) && catOk(o));
        const groups = {};
        os.forEach(o=>{ const k=[o.technology_id,o.production_system_id,ind==="effectiveness"?(o.outcome_en||""):""].join("|"); (groups[k]=groups[k]||[]).push(o); });
        const keys = Object.keys(groups);
        if(!keys.length) rows.push({p, ind, sys:"all", cells:cellsFor([], rid=>atEmpty(p, ind, "all", rid))});
        keys.forEach(k=>{ const [tech, sys] = k.split("|"); rows.push({p, ind, sys, tech, cells:cellsFor(groups[k], rid=>atEmpty(p, ind, sys, rid))}); });
        return;
      }
      const os = atl.obs.filter(o=>o.product_id===p && o.indicator_id===ind && inR(o) && sysOk(o));
      let systems = sysF.length ? [...sysF] : [...new Set(os.map(o=>o.production_system_id))];
      if(!systems.length) systems = ["all"];
      const order = atl.cfg.systems.map(x=>x.id); systems.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
      systems.forEach(sys=>rows.push({p, ind, sys, cells:cellsFor(os.filter(o=>o.production_system_id===sys), rid=>atEmpty(p, ind, sys, rid))}));
    });
    // birleşik (ürüne özgü olmayan) kanıt: sebze grubu seçiliyse ayrı satır
    if(ind==="effectiveness" && sub.p.some(p=>(atl.products.find(x=>x.id===p)||{}).group==="Sebzeler")){
      const os = atl.obs.filter(o=>!o.product_id && o.product_scope==="vegetables_pooled" && o.indicator_id==="effectiveness" && inR(o) && sysOk(o) && catOk(o));
      const g = {}; os.forEach(o=>{ const k=o.technology_id+"|"+o.production_system_id; (g[k]=g[k]||[]).push(o); });
      Object.entries(g).forEach(([k,list])=>{ const [tech,sys]=k.split("|"); rows.push({p:null, pooled:true, ind, sys, tech, cells:cellsFor(list, ()=>({label:"e_not_assessed", why:""}))}); });
    }
  });
  if(inds.includes("reliability")){
    sub.p.forEach(p=>{
      const cells = {};
      R.forEach(rid=>{ const q = {}; rows.filter(r=>r.p===p).forEach(r=>((r.cells[rid]||{}).obs||[]).forEach(o=>q[o.data_quality]=(q[o.data_quality]||0)+1));
        cells[rid] = Object.keys(q).length ? {rel:q} : {empty:{label:"e_na", why:t("relNone")}}; });
      rows.push({p, ind:"reliability", sys:"all", cells});
    });
  }
  rows.forEach(r=>r.warn = atWarn(r, sub));
  return {rows, inds, gaps:atlasGaps(rows, sub, inds)};
}
function atWarn(r, sub){
  const all = Object.values(r.cells).flatMap(c=>c.obs||[]), w = [];
  const yrs = [...new Set(all.map(o=>o.data_year).filter(Boolean))];
  if(yrs.length>1) w.push(t("w_years")(yrs.sort().join(", ")));
  if(new Set(all.map(o=>o.system_boundary).filter(Boolean)).size>1) w.push(t("w_bound"));
  if(new Set(all.map(o=>o.functional_unit).filter(Boolean)).size>1) w.push(t("w_fu"));
  const regsWith = Object.entries(r.cells).filter(([,c])=>c.obs&&c.obs.length).map(([k])=>k);
  if(regsWith.length>1 && new Set(all.map(o=>o.source_id)).size>1 && ["product_cf","solution_cf","effectiveness"].includes(r.ind)) w.push(t("w_methods"));
  if(all.some(o=>o.comparability_status==="member_state_proxy")) w.push(t("w_member"));
  if(all.some(o=>o.comparability_status==="pooled_not_crop_specific")) w.push(t("w_pooled"));
  if(all.some(o=>(o.note||"").includes("same_value_across_systems"))) w.push(t("w_same_sys"));
  if(all.some(o=>(o.note||"").startsWith("Fiyat yalnızca yumuşak"))) w.push(t("w_soft"));
  if(regsWith.includes("es") && regsWith.includes("eu27") && ["production_volume","production_value","econ_rank"].includes(r.ind)) w.push(t("w_es_eu"));
  return w;
}
function atlasGaps(rows, sub, inds){
  const verified = [], method = [], incomplete = [], seen = new Set();
  atl.checks.filter(c=>sub.p.includes(c.product_id) && sub.r.includes(c.region_id) && inds.includes(c.indicator_id)).forEach(c=>{
    const k = [c.product_id,c.region_id,c.indicator_id].join("|"); if(seen.has(k)) return; seen.add(k);
    const g = verified.find(x=>!x.report && x.ind===c.indicator_id && x.src===c.source_id && x.why===c.why);
    if(g){ if(!g.ps.includes(c.product_id)) g.ps.push(c.product_id); if(!g.r.includes(c.region_id)) g.r.push(c.region_id); }
    else verified.push({ps:[c.product_id], r:[c.region_id], ind:c.indicator_id, src:c.source_id, why:c.why});
  });
  const ro = atl.cfg.regions.map(x=>x.id); verified.forEach(x=>x.r.sort((a,b)=>ro.indexOf(a)-ro.indexOf(b)));
  rows.filter(r=>r.warn.some(x=>x===t("w_bound")||x===t("w_fu")||x===t("w_methods"))).forEach(r=>{
    method.push({ps:r.p?[r.p]:[], pooled:r.pooled, r:Object.entries(r.cells).filter(([,c])=>c.obs&&c.obs.length).map(([k])=>k), ind:r.ind});
  });
  const crops = new Set(sub.p.map(p=>(atl.products.find(x=>x.id===p)||{}).tr));
  state.reports.filter(r=>crops.has(r.crop) && ["no_field_proven","no_validated","no_scalable"].includes(r.maturity)).forEach(r=>{
    const p = atl.products.find(x=>x.tr===r.crop);
    verified.push({ps:p?[p.id]:[], r:[], ind:"field", report:r});
  });
  rows.forEach(r=>Object.entries(r.cells).forEach(([rid,c])=>{ if(c.empty && c.empty.label==="e_not_assessed")
    incomplete.push(`${r.pooled?t("pooledRow"):aP(r.p)} · ${aR(rid)} · ${aI(r.ind)}${r.sys&&r.sys!=="all"?" · "+aS(r.sys):""}`); }));
  return {verified, method, incomplete:[...new Set(incomplete)]};
}

function obsHtml(o, rowKey){
  const k = rowKey+"|"+o.id, flag = o.eurostat_flag ? ` · ${t("fl_"+o.eurostat_flag)||o.eurostat_flag}` : "";
  let main;
  if(o.indicator_id==="econ_rank") main = `<b>${t("rankOf")(o.rank,o.of)}</b><span class="u">(${o.data_year})</span>`;
  else if(o.indicator_id==="cf_reduction"||o.indicator_id==="effectiveness"){
    const sign = o.value>0?"+":"";
    main = `<b>${sign}${nf(o.value)}</b><span class="u">${esc(unitL(o.unit))}</span> <span class="u">${esc(L2({tr:o.outcome_tr,en:o.outcome_en}))}</span>
      <span class="at-e" style="display:block;font-style:normal">${t("baseline")}: ${esc(L2({tr:o.baseline_tr,en:o.baseline_en}))}${o.n_studies?" · "+t("nStudies")(o.n_studies):""}</span>`;
  } else main = `<b>${nf(o.value)}</b> <span class="u">${esc(unitL(o.unit))}</span>${o.data_year?` <span class="u">(${o.data_year}${flag})</span>`:""}`;
  const cond = o.conditions_tr ? `<span class="at-e" style="display:block;font-style:normal">${esc(L2({tr:o.conditions_tr,en:o.conditions_en}))}${o.geo_scope?" · "+esc(o.geo_scope.startsWith("member_state:")?(lang==="en"?"Italy (member state)":"İtalya (üye ülke)"):biL(o.geo_scope)):""}</span>` : "";
  return `<span class="at-v">${main}${cond}
    <span class="q ${esc(o.data_quality)}">${esc(aQ(o.data_quality))}</span>${o.system_boundary?`<span class="bd">${esc(aB(o.system_boundary))}</span>`:""}
    <button type="button" class="srcbtn" data-k="${esc(k)}" aria-expanded="${atl.open.has(k)}">${atl.open.has(k)?t("atHide"):t("atSrc")}</button></span>`;
}
function detHtml(o){
  const s = atl.src[o.source_id]||{};
  const row = (a,b)=> b==null||b===""?"":`<dt>${a}</dt><dd>${b}</dd>`;
  const link = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.doi||s.url)}</a>` : "";
  return `<dl>${row(t("dSource"), esc(s.title||o.source_id))}${row(t("dAuthors"), esc(biL(s.authors)))}${row(t("dJournal"), esc(s.journal))}
    ${row("DOI / URL", link)}${row(t("dYear"), esc(s.publication_year??t("notStated")))}${row(t("dDataYear"), esc(o.data_year??t("notStated")))}
    ${row(t("dGeo"), esc(biL(s.geo)))}${row(t("dSystem"), esc(aS(o.production_system_id)))}${o.technology_id?row(t("tech"), esc(aT(o.technology_id))):""}
    ${row(t("dFU"), esc(biL(o.functional_unit)||""))}${o.system_boundary?row(t("dBound"), esc(aB(o.system_boundary))):""}
    ${row(t("dMethod"), esc(biL(o.methodology)))}${row(t("dQuality"), esc(aQ(o.data_quality)))}
    ${o.eurostat_flag?row(t("dFlag"), esc(t("fl_"+o.eurostat_flag)||o.eurostat_flag)):""}
    ${o.comparability_status?row(t("dComp"), esc(t("cs_"+o.comparability_status)||o.comparability_status)):""}
    ${o.query_url?row(t("dQuery"), `<a href="${esc(o.query_url)}" target="_blank" rel="noopener">Eurostat API</a>`):""}</dl>`;
}
function rowLabel(r){
  const name = r.pooled ? t("pooledRow") : aP(r.p);
  const extra = [r.sys&&r.sys!=="all"?aS(r.sys):(r.ind==="reliability"||r.ind==="econ_rank"?"":t("sysAll")), r.tech?aT(r.tech):""].filter(Boolean).join(" · ");
  return `<b>${esc(name)}</b>${extra?`<span class="at-e" style="display:block;font-style:normal">${esc(extra)}</span>`:""}`;
}
function atlasResultHtml(){
  const sub = atl.sub, res = atl.res, R = sub.r;
  const crit = [`${t("atProducts")}: <b>${sub.p.map(aP).map(esc).join(", ")}</b>`, `${t("atRegions")}: <b>${R.map(aR).map(esc).join(", ")}</b>`,
    `${t("atSystems")}: <b>${sub.s.length?sub.s.map(aS).map(esc).join(", "):t("atAnySys")}</b>`, `${t("atCats")}: <b>${sub.c.length?sub.c.map(aC).map(esc).join(", "):t("atAnyCat")}</b>`,
    `${t("atInds")}: <b>${res.inds.map(aI).map(esc).join(", ")}</b>${sub.i.length?"":" "+t("atDefInd")}`].join(" · ");
  const stale = selKey(atl.sel)!==selKey(sub);
  let body = "";
  res.inds.forEach(ind=>{
    const rs = res.rows.filter(r=>r.ind===ind); if(!rs.length) return;
    const meta = atl.cfg.indicators.find(x=>x.id===ind);
    body += `<tr class="ind"><th colspan="${R.length+1}">${esc(aI(ind))}${meta&&meta.unit?` <span class="at-e" style="font-weight:400">(${esc(unitL(meta.unit))})</span>`:""}${meta?` <span class="at-e" style="font-weight:400;display:block">${esc(L2({tr:meta.method_tr,en:meta.method_en}))}</span>`:""}</th></tr>`;
    rs.forEach((r,ri)=>{
      const rk = `${ind}|${r.p}|${r.sys}|${r.tech||""}|${ri}`;
      body += `<tr><th class="rk" scope="row">${rowLabel(r)}${r.warn.map(w=>`<span class="warn">⚠ ${esc(w)}</span>`).join("")}</th>${R.map(rid=>{
        const c = r.cells[rid]||{};
        if(c.rel) return `<td>${Object.entries(c.rel).map(([q,n])=>`<span class="q ${esc(q)}">${esc(aQ(q))} ×${n}</span>`).join(" ")}</td>`;
        if(c.obs) return `<td>${c.obs.map(o=>obsHtml(o, rk)).join("")}</td>`;
        return `<td><span class="at-e">${t(c.empty.label)}</span>${c.empty.why?`<span class="at-e" style="display:block;font-size:12px">${esc(c.empty.why)}</span>`:""}</td>`;
      }).join("")}</tr>`;
      R.forEach(rid=>((r.cells[rid]||{}).obs||[]).forEach(o=>{ if(atl.open.has(rk+"|"+o.id)) body += `<tr class="det"><td colspan="${R.length+1}"><b>${esc(aP(r.p)||t("pooledRow"))} · ${esc(aR(rid))}</b>${detHtml(o)}</td></tr>`; }));
    });
  });
  const world = R.includes("world") ? `<p class="at-hint">${esc(L2(atl.cfg.world_source_note))}</p>` : "";
  return `<div class="at-stale" role="status" ${stale?"":"hidden"}><span aria-hidden="true">⟳</span><span>${t("atStale")}</span></div>
    <p class="at-crit">${t("atCrit")}: ${crit}</p>${world}
    ${res.rows.length?`<div class="at-tw"><table class="at"><thead><tr><th class="rk">${t("atRow")}</th>${R.map(rid=>`<th>${esc(aR(rid))}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`:`<p class="empty">${t("atNoRes")}</p>`}
    ${gapsHtml(res.gaps)}`;
}
function gapsHtml(g){
  const card = (x, cls) => {
    const ind = x.ind==="field" ? "field" : x.ind;
    const name = x.ind==="field" ? (lang==="en"?"Field validation":"Saha doğrulaması") : aI(x.ind);
    const hi = ["product_cf","effectiveness","field","production_value"].includes(ind);
    return `<li class="${cls}"><b class="h">${esc(name)}</b>
      <dl><dt>${t("gProduct")}</dt><dd>${esc(x.pooled?t("pooledRow"):x.ps.map(aP).join(", "))}</dd>
      ${x.r.length?`<dt>${t("gRegion")}</dt><dd>${x.r.map(aR).map(esc).join(", ")}</dd>`:""}</dl>
      <dl>${cls==="m"?`<dt>${t("gMissing")}</dt><dd>${lang==="en"?"Methods do not match":"Yöntemler uyuşmuyor"}</dd>`:""}
      <dt>${t("gWhy")}</dt><dd>${t(cls==="m"?"gw_method":"gw_"+ind)||""}</dd>
      <dt>${t("gAct")}</dt><dd>${t(cls==="m"?"ga_method":"ga_"+ind)||""}</dd>
      <dt>${t("gInno")}</dt><dd>${t(hi?"gi_high":"gi_mid")}</dd>
      ${x.src?`<dt>${t("gChecked")}</dt><dd>${esc(aSrc(x.src))} — ${t("why_"+x.why)||esc(x.why)}</dd>`:""}
      ${x.report?`<dt>${t("gChecked")}</dt><dd><a href="#/r/${encodeURIComponent(x.report.id)}">${esc(x.report.id)}</a> — ${t("m_"+x.report.maturity)}</dd>`:""}</dl></li>`;
  };
  return `<section class="gaps"><h2>${t("gapsH")}</h2><p class="why">${t("gapsP")}</p>
    <h3>${t("gapsV")} (${g.verified.length})</h3>${g.verified.length?`<ul class="gap-list">${g.verified.map(x=>card(x,"v")).join("")}</ul>`:`<p class="why">${t("gapsNone")}</p>`}
    ${g.method.length?`<h3>${t("gapsM")} (${g.method.length})</h3><ul class="gap-list">${g.method.map(x=>card(x,"m")).join("")}</ul>`:""}
    ${g.incomplete.length?`<details class="incomp"><summary>${t("gapsI")(g.incomplete.length)}</summary><ul>${g.incomplete.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}</section>`;
}
function atlasCsv(){
  if(!atl.res) return;
  const R = atl.sub.r, out = [["product","indicator","production_system","technology","outcome","region","value","unit","status","data_year","data_quality","system_boundary","functional_unit","source","source_url","warnings"]];
  atl.res.rows.forEach(r=>R.forEach(rid=>{
    const c = r.cells[rid]||{}, base = [r.pooled?t("pooledRow"):aP(r.p), aI(r.ind), aS(r.sys||"all"), r.tech?aT(r.tech):""];
    const w = r.warn.join(" | ");
    if(c.rel) out.push([...base, "", aR(rid), Object.entries(c.rel).map(([q,n])=>aQ(q)+" x"+n).join("; "), "", "", "", "", "", "", "", "", w]);
    else if(c.obs) c.obs.forEach(o=>{ const s = atl.src[o.source_id]||{};
      out.push([...base, L2({tr:o.outcome_tr,en:o.outcome_en}), aR(rid), o.indicator_id==="econ_rank"?`${o.rank}/${o.of}`:o.value, unitL(o.unit), "", o.data_year??"", aQ(o.data_quality),
        o.system_boundary?aB(o.system_boundary):"", biL(o.functional_unit)||"", s.title||o.source_id, s.url||o.query_url||"", w]); });
    else out.push([...base, "", aR(rid), "", "", t(c.empty.label)+(c.empty.why?" — "+c.empty.why:""), "", "", "", "", "", "", w]);
  }));
  const csv = "﻿"+out.map(row=>row.map(v=>{ const x=String(v??""); return /[",\n;]/.test(x)?`"${x.replace(/"/g,'""')}"`:x; }).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `agrigap-atlas-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}

/* Yeni Öneriler'e bağlantı: atlas verisinden kural tabanlı fırsat sinyalleri */
function atlasOpps(){
  if(!atl.loaded) return [];
  const c = atl.cfg, rule = c.opportunity_rules, cards = [], ids = new Set(((idv.data&&idv.data.candidates)?Object.values(idv.data.candidates).flat():[]).map(x=>x.id));
  const srcA = id => { const s=atl.src[id]||{}; return s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||id)}</a>`:esc(s.title||id); };
  const link = (p,r,i) => `#/atlas/p=${p.join(",")};r=${r.join(",")};i=${i.join(",")}`;
  const push = x => { if(!ids.has(x.id) && !cards.find(y=>y.id===x.id)) cards.push(x); };
  c.regions.forEach(reg=>{
    const vals = atl.obs.filter(o=>o.indicator_id==="production_value" && o.region_id===reg.id && o.production_system_id==="all");
    const yr = vals.map(o=>o.data_year).sort().pop();
    const ranked = vals.filter(o=>o.data_year===yr).sort((a,b)=>b.value-a.value);
    const top = Math.max(1, Math.ceil(ranked.length*rule.high_value_top_share));
    ranked.slice(0, ranked.length>=2?top:0).forEach((v,i)=>{
      const cfs = atl.obs.filter(o=>o.product_id===v.product_id && o.region_id===reg.id && o.indicator_id==="product_cf").sort((a,b)=>b.value-a.value);
      if(!cfs.length || cfs[0].value < rule.high_cf_kg) return;
      push({id:`atlas:r1:${v.product_id}:${reg.id}`, rule:"r1", p:v.product_id, r:reg.id,
        ev:`${aP(v.product_id)} · ${aR(reg.id)}: ${nf(v.value)} ${unitL(v.unit)} (${v.data_year}, ${srcA(v.source_id)}); ${cfs.map(o=>`${nf(o.value)} kg CO2e/kg, ${esc(aB(o.system_boundary))} (${srcA(o.source_id)})`).join("; ")}`,
        inf:t("r1i")(aP(v.product_id), aR(reg.id), i+1, ranked.length, nf(cfs[0].value), aB(cfs[0].system_boundary)), hy:t("r1h"), sp:t("r1s"),
        href:link([v.product_id],[reg.id],["product_cf","production_value","econ_rank"])});
    });
  });
  atl.obs.filter(o=>o.product_id && o.indicator_id==="effectiveness" && /water/i.test(o.outcome_en||"")).forEach(o=>{
    const same = atl.obs.filter(x=>x.source_id===o.source_id && x.product_id===o.product_id && x.indicator_id==="effectiveness");
    push({id:`atlas:r2:${o.product_id}:${o.technology_id}`, rule:"r2", p:o.product_id, r:o.region_id,
      ev:same.map(x=>`${esc(aT(x.technology_id))}: ${esc(L2({tr:x.outcome_tr,en:x.outcome_en}))} ${x.value>0?"+":""}${nf(x.value)} ${esc(x.unit)} (${t("baseline")}: ${esc(L2({tr:x.baseline_tr,en:x.baseline_en}))}; ${x.n_studies?t("nStudies")(x.n_studies)+", ":""}${srcA(x.source_id)})`).join("<br>"),
      inf:t("r2i")(aP(o.product_id), L2({tr:o.outcome_tr,en:o.outcome_en}), `${o.value>0?"+":""}${nf(o.value)} ${o.unit}`), hy:t("r2h"), sp:"",
      href:link([o.product_id],[o.region_id],["effectiveness"])});
  });
  const byCrop = {};
  state.reports.filter(r=>["no_field_proven","no_validated","no_scalable"].includes(r.maturity)).forEach(r=>(byCrop[r.crop]=byCrop[r.crop]||[]).push(r));
  Object.entries(byCrop).forEach(([crop,rs])=>{ const p = atl.products.find(x=>x.tr===crop);
    push({id:`atlas:r3:${crop}`, rule:"r3", p:p&&p.id, r:null, ev:rs.map(r=>`<a href="#/r/${encodeURIComponent(r.id)}">${esc(r.id)}</a> — ${t("m_"+r.maturity)}`).join("<br>"),
      inf:t("r3i")(crop, rs.length), hy:t("r3h"), sp:"", href:p?link([p.id],["tr","es","eu27"],["effectiveness","trl"]):""}); });
  c.regions.forEach(reg=>{
    const vol = atl.obs.filter(o=>o.indicator_id==="production_volume" && o.region_id===reg.id && o.production_system_id==="all").sort((a,b)=>b.value-a.value);
    vol.slice(0, Math.ceil(vol.length*rule.high_value_top_share)).forEach(v=>{
      const ck = atl.checks.find(x=>x.product_id===v.product_id && x.region_id===reg.id && x.indicator_id==="production_value" && x.why==="no_value_for_geo");
      if(!ck) return;
      push({id:`atlas:r4:${v.product_id}:${reg.id}`, rule:"r4", p:v.product_id, r:reg.id,
        ev:`${aP(v.product_id)} · ${aR(reg.id)}: ${nf(v.value)} ${unitL(v.unit)} (${v.data_year}, ${srcA(v.source_id)}); ${srcA(ck.source_id)}: ${t("why_no_value_for_geo")}`,
        inf:t("r4i")(aP(v.product_id), aR(reg.id), nf(v.value)), hy:t("r4h"), sp:"", href:link([v.product_id],[reg.id,"es","eu27"].filter((x,i,a)=>a.indexOf(x)===i),["production_volume","production_value","value_per_kg"])});
    });
  });
  return cards;
}
function oppsHtml(){
  if(!atl.loaded) return atl.err ? "" : `<section class="id-sec"><h2>${t("oppH")}</h2><p class="why" role="status">${t("atLoading")}</p></section>`;
  const cs = atlasOpps();
  return `<section class="id-sec"><h2>${t("oppH")} (${cs.length})</h2><p class="why">${t("oppP")}</p>
    ${cs.length?`<ul class="id-list">${cs.map(x=>`<li class="id-card opp"><span class="lay">${t("opRule")}: ${t(x.rule)}</span>
      <b class="h">${esc(aP(x.p)||"—")}${x.r?" · "+esc(aR(x.r)):""}</b>
      <dl class="lv"><dt class="ev">${t("opEv")}</dt><dd>${x.ev}</dd><dt class="in">${t("opIn")}</dt><dd>${esc(x.inf)}</dd>
      <dt class="hy">${t("opHy")}</dt><dd>${esc(x.hy)}</dd><dt class="sp">${t("opSp")}</dt><dd>${x.sp?esc(x.sp):"—"}</dd></dl>
      ${x.href?`<div class="lnk"><a href="${x.href}">${t("opSee")}</a></div>`:""}</li>`).join("")}</ul>`:`<p class="why">${t("oppNone")}</p>`}</section>`;
}

function route(){
  const tab = location.hash.startsWith("#/harita") ? "map" : location.hash.startsWith("#/mevzuat") ? "reg" : location.hash.startsWith("#/oneriler") ? "ideas" : location.hash.startsWith("#/atlas") ? "atlas" : "reports";
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===tab ? "page" : "false"));
  if(tab==="map"){
    const mm = location.hash.match(/^#\/harita\/([^/]+)\/([^/]+)(?:\/([^/]+))?/);
    if(mm){ mx.sel=[mm[1],mm[2]]; if(mm[3]) mx.layer=mm[3]; }
    document.title = t("tabMap")+" — AgriGap"; mapPage();
    if(mm){ const b=app.querySelector(`table.mx td button[data-c="${mm[1]}"][data-o="${mm[2]}"]`); if(b) b.scrollIntoView({block:"center",inline:"center"}); }
    return; }
  if(tab==="atlas"){ document.title = t("tabAtlas")+" — AgriGap"; if(atl.loaded) atlasHashSel(); atlasPage(); return; }
  if(tab==="ideas"){ document.title = t("tabIdeas")+" — AgriGap";
    const again = ()=>{ if(location.hash.startsWith("#/oneriler")) ideasPage(); };
    loadCards().then(again); loadAtlas().then(again).catch(again); ideasPage(); return; }
  if(tab==="reg"){ document.title = t("tabReg")+" — AgriGap"; regPage(); return; }
  const m = location.hash.match(/^#\/r\/(.+)$/);
  if(m) report(decodeURIComponent(m[1]));
  else { document.title = lang==="en" ? "AgriGap — Solution gaps in farming" : "AgriGap — Tarımdaki çözüm boşlukları"; home(); }
}
window.addEventListener("hashchange",route);

  fetch("discoveries/index.json",{cache:"no-store"}).then(r=>r.json()),

  fetch("matrix/matrix.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
  fetch("core/regulations.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
  fetch("ideas/candidates.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
  fetch("ideas/cards.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>null)
]).then(([d,tg,mm,rr,ii,cc])=>{state.reports=d.reports||[];state.targets=Array.isArray(tg)?tg:[];mx.data=mm;rg.data=rr;idv.data=ii;ic.index=cc;setLang(lang);})
  .catch(()=>{setLang(lang);app.innerHTML=`<p class="empty">${t("loadErr")}</p>`;});
